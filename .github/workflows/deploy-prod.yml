name: Criar Tags de Rollback

on:
  push:
    branches: [main]

jobs:
  snapshot-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rotaciona histórico de rollback
        run: |
          git fetch --tags
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Rotaciona tags: rollback-2 -> rollback-3, rollback-1 -> rollback-2
          if git rev-parse rollback-2 >/dev/null 2>&1; then
            git tag -d rollback-3 2>/dev/null || true
            git push origin :refs/tags/rollback-3 2>/dev/null || true
            git tag rollback-3 rollback-2
            git push origin rollback-3
          fi

          if git rev-parse rollback-1 >/dev/null 2>&1; then
            git tag -d rollback-2 2>/dev/null || true
            git push origin :refs/tags/rollback-2 2>/dev/null || true
            git tag rollback-2 rollback-1
            git push origin rollback-2
          fi

          # Cria novo rollback-1 com o commit anterior
          git tag -d rollback-1 2>/dev/null || true
          git push origin :refs/tags/rollback-1 2>/dev/null || true
          git tag rollback-1 ${{ github.event.before }}
          git push origin rollback-1
