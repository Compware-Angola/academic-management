name: Criar Tags de Rollback

on:
  push:
    branches: [main]

jobs:
  snapshot-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rotaciona histórico de rollback
        run: |
          git fetch --tags

          # Delete all rollback tags first to avoid conflicts
          for tag in rollback-1 rollback-2 rollback-3; do
            if git rev-parse $tag >/dev/null 2>&1; then
              git tag -d $tag
              git push origin :refs/tags/$tag
            fi
          done

          # Now recreate them in order
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git tag rollback-1 ${{ github.event.before }}
            git push origin rollback-1
          fi
